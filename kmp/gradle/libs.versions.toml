# GreenThumb KMP pins (architecture.md §4; probe-verified 2026-09-20).
# ТОЛЬКО точные версии — диапазоны запрещены.

[versions]
agp = "9.3.1"
kotlin = "2.4.20"
composeMultiplatform = "1.12.0"
composeMaterial3 = "1.12.0-alpha03"
# 2026-09-25: KSP 2.3.12 собрал реальный Room 2.8.5 (сущности/DAO/GreenThumbDb)
# на Kotlin 2.4.20, конфигурации kspAndroid+kspJvm. Fallback на Kotlin 2.3.21
# не понадобился. Файлы под KSP — синтаксис Kotlin ≤2.3 (Analysis API 2.3.20).
ksp = "2.3.12"
ktor = "3.5.2"
# Kotlin 2.4.20: serialization-плагин больше не вшивает рантайм (версияless-зависимость
# не резолвится), поэтому пин. 1.11.0 — последняя стабильная, в Котлине 2.4 работает
# (probe-прогон 2026-09-21), её же тащит сам Ktor 3.5.2 (ktor-serialization-kotlinx-json-jvm).
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.11.0"
kotlinxDatetime = "0.8.0"
koin = "4.2.2"
lifecycle = "2.11.0"
navigation = "2.9.2"
coil = "3.6.3"
room = "2.8.5"
sqliteBundled = "2.7.1"
datastore = "1.2.1"
activityCompose = "1.13.0"
foojayResolver = "1.0.0"

[plugins]
foojayResolver = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojayResolver" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# androidx.room (не room3): schemaDirectory для экспорта схемы. Версия = room 2.8.5.
room = { id = "androidx.room", version.ref = "room" }

[libraries]
composeRuntime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
composeFoundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
composeUi = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
composeMaterial3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
# Compose UI-тесты на desktop (VAL-DS-003 pressed-ветка). Версия = CMP-пин 1.12.0,
# повышение версии не требуется; сам артфакт — тот же org.jetbrains.compose.ui, что и composeUi.
composeUiTestJunit4 = { module = "org.jetbrains.compose.ui:ui-test-junit4", version.ref = "composeMultiplatform" }
androidxActivityCompose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
kotlinxDatetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
ktorClientCore = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktorClientOkhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktorClientCio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktorClientMock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktorClientContentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktorClientLogging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktorSerializationKotlinxJson = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
kotlinxSerializationJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinxCoroutinesCore = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinxCoroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinTest = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
koinCore = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koinCompose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koinComposeViewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
lifecycleViewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
navigationCompose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation" }
coilCompose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coilNetworkKtor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
roomRuntime = { module = "androidx.room:room-runtime", version.ref = "room" }
roomCompiler = { module = "androidx.room:room-compiler", version.ref = "room" }
sqliteBundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqliteBundled" }
datastorePreferencesCore = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }
