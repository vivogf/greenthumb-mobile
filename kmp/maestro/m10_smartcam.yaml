# Smart camera: the in-app CameraX viewfinder (feature m11-camerax-viewfinder; VAL-CAM11-001..018, 023..027;
# earlier M10 VAL-CAM-001/003/005/006/008..012).
# Run every stage through render-smoke.sh (GT_FLOW=m10_smartcam.yaml GT_STEP=<stage> GT_KEY_FILE=<600 key file>);
# only `login` uses the key. The caller pushes a Monstera JPEG to /sdcard/Pictures + media scan, and passes
# PHOTO (content description regex of that photo in the picker) through the env of the gallery stages.
# On elt_test the back camera is the emulator's virtual scene. A first open shows the system camera permission
# dialog; the flow allows it («While using the app»). Nothing is sent before «Узнать вид» / «Проверить растение».
#   login     clean start, sign in with the throwaway key, wait for the dashboard
#   ru / en   Profile → language
#   dash      dashboard: the icon-only «Умная камера» button (content description), screenshot
#   open      open the camera: live viewfinder, ✕, both modes with their hints and shutters, back to «Растение»
#   shot      (viewfinder open) shutter → after-shot with «Узнать вид» and the Pl@ntNet note, no request;
#             «Переснять» → viewfinder in «Растение»
#   dshot     (viewfinder open) «Болезнь» → shutter → after-shot with «Проверить растение», the note field and
#             the AI note, no request; «Переснять» → viewfinder in «Болезнь»
#   gcancel   gallery → Back in the picker → viewfinder again, nothing sent
#   gallery   gallery → ${PHOTO} → after-shot → «Узнать вид» → plant result (1 live Pl@ntNet call); stays on it
#   retake    on a result: «Снять ещё раз» → viewfinder with «Растение»
#   addmine   on a result: «Добавить к моим растениям» → Add Plant prefilled (name, photo); Back saves nothing
#   justlook  on a result: «Просто узнать» → dashboard
#   close     (viewfinder open) ✕ → dashboard
# Disease mode (feature m10-standalone-diagnosis; VAL-CAM-009/010/012). The account needs plants, one named ${PLANT}.
#   disease   open the camera → «Болезнь» → gallery → ${PHOTO} → «Проверить растение» → diagnosis result
#             (1 live OpenAI call): «Растение не из вашего списка…», «Это моё растение?», «Готово»
#   dcheck    the same result checks without a new request (the result is already on screen)
#   mine      «Это моё растение?» → «Какое из ваших растений?» → ${PLANT} → «Сохраним в журнал растения…» →
#             «Сохранить в журнал растения» → «Сохранено в журнал» (no second diagnosis), «Это моё растение?»
#             gone; «Готово» → dashboard
#   dcancel   open the camera → «Болезнь» → shutter → «Проверить растение»; the caller has airplane mode on and
#             the request fails with a network error; Back closes the camera
#   denied    the caller revoked the camera permission: open the camera, refuse the dialog → message,
#             «Выбрать из галереи» and «Открыть настройки», no shutter
appId: com.greenthumbplantcare.debug
name: GreenThumb smart camera (${STEP})
---
- runFlow:
    when:
      true: ${STEP == 'login'}
    commands:
      - launchApp:
          clearState: true
      # On elt_test the first launch after clearState sometimes leaves Maestro with an empty app hierarchy
      # (the screen shows «Key not found», Maestro sees only the status bar) until the app is launched again.
      # The quick loop below then ran out without a tap and the key field was never reached.
      - repeat:
          times: 4
          while:
            notVisible: "Skip|Пропустить|Key not found|Ключ не найден|I Have a Key|У меня есть ключ|Welcome Back|С возвращением"
          commands:
            - extendedWaitUntil:
                visible: "Skip|Пропустить|Key not found|Ключ не найден|I Have a Key|У меня есть ключ|Welcome Back|С возвращением"
                timeout: 15000
                optional: true
            - runFlow:
                when:
                  notVisible: "Skip|Пропустить|Key not found|Ключ не найден|I Have a Key|У меня есть ключ|Welcome Back|С возвращением"
                commands:
                  - launchApp
      - repeat:
          times: 15
          while:
            notVisible: "Welcome Back|С возвращением"
          commands:
            - runFlow:
                when:
                  visible: "Skip|Пропустить"
                commands:
                  - tapOn: "Skip|Пропустить"
            - runFlow:
                when:
                  visible: "Key not found|Ключ не найден"
                commands:
                  - tapOn: "Enter recovery key|Ввести ключ"
            - runFlow:
                when:
                  visible: "I Have a Key|У меня есть ключ"
                commands:
                  - tapOn: "I Have a Key|У меня есть ключ"
      - extendedWaitUntil:
          visible: "Welcome Back|С возвращением"
          timeout: 10000
      - tapOn: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
      - inputText: ${GT_RECOVERY_KEY}
      - hideKeyboard
      - tapOn: "Sign In|Войти"
      - extendedWaitUntil:
          visible: "Profile|Профиль"
          timeout: 30000

- runFlow:
    when:
      true: ${STEP == 'ru' || STEP == 'en'}
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible: "Profile|Профиль"
          timeout: 30000
      - tapOn: "Profile|Профиль"
      - scrollUntilVisible:
          element:
            text: "Language|Язык"
          direction: DOWN
      - tapOn: "Language|Язык"
      - extendedWaitUntil:
          visible: "Choose Language|Выберите язык"
          timeout: 10000
      - runFlow:
          when:
            true: ${STEP == 'ru'}
          commands:
            - tapOn: "Русский"
      - runFlow:
          when:
            true: ${STEP == 'en'}
          commands:
            - tapOn: "English"
      - tapOn: "Plants|Растения"

- runFlow:
    when:
      true: ${STEP == 'dash'}
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible: "Умная камера|Smart camera"
          timeout: 30000
      - assertNotVisible: "Камера|Camera"
      - takeScreenshot: dash

- runFlow:
    when:
      true: ${STEP == 'open'}
    commands:
      - tapOn: "Умная камера|Smart camera"
      - runFlow:
          when:
            visible: "While using the app|При использовании приложения"
          commands:
            - tapOn: "While using the app|При использовании приложения"
      - extendedWaitUntil:
          visible: "Снять растение|Photograph the plant"
          timeout: 15000
      - assertVisible: "Закрыть камеру|Close the camera"
      - assertVisible: "Растение|Plant"
      - assertVisible: "Болезнь|Problem"
      - assertVisible: "Выбрать из галереи|Choose from gallery"
      - assertVisible: "Растение целиком, при дневном свете|The whole plant, in daylight"
      - assertNotVisible: "Сделать фото|Take photo"
      - takeScreenshot: open-plant
      - tapOn: "Болезнь|Problem"
      - assertVisible: "Снять больное место|Photograph the sick spot"
      - assertVisible: "Больное место крупно, в фокусе|The sick spot close up, in focus"
      - takeScreenshot: open-disease
      - swipe:
          direction: RIGHT
      - extendedWaitUntil:
          visible: "Снять растение|Photograph the plant"
          timeout: 5000
- runFlow:
    when:
      true: ${STEP == 'gcancel'}
    commands:
      - tapOn: "Выбрать из галереи|Choose from gallery"
      - waitForAnimationToEnd
      - takeScreenshot: gcancel-picker
      - back
      - extendedWaitUntil:
          visible: "Снять растение|Photograph the plant|Снять больное место|Photograph the sick spot"
          timeout: 10000
      - takeScreenshot: gcancel-back

- runFlow:
    when:
      true: ${STEP == 'shot'}
    commands:
      - tapOn: "Снять растение|Photograph the plant"
      - extendedWaitUntil:
          visible: "Узнать вид|Identify species"
          timeout: 15000
      - assertVisible: ".*Pl@ntNet.*"
      - assertVisible: "Переснять|Retake"
      - assertNotVisible: "Что вас беспокоит.*|What worries you.*"
      - takeScreenshot: shot-aftershot
      # The 3:4 after-shot (M11c) can push «Переснять» below the fold.
      - scrollUntilVisible:
          element:
            text: "Переснять|Retake"
          direction: DOWN
      - tapOn: "Переснять|Retake"
      - extendedWaitUntil:
          visible: "Снять растение|Photograph the plant"
          timeout: 15000

- runFlow:
    when:
      true: ${STEP == 'dshot'}
    commands:
      - tapOn: "Болезнь|Problem"
      - tapOn: "Снять больное место|Photograph the sick spot"
      - extendedWaitUntil:
          visible: "Проверить растение|Check the plant"
          timeout: 15000
      - assertVisible: "Что вас беспокоит.*|What worries you.*"
      - assertVisible: ".*OpenAI.*"
      - takeScreenshot: dshot-aftershot
      - scrollUntilVisible:
          element:
            text: "Переснять|Retake"
          direction: DOWN
      - tapOn: "Переснять|Retake"
      - extendedWaitUntil:
          visible: "Снять больное место|Photograph the sick spot"
          timeout: 15000
      - tapOn: "Растение|Plant"

- runFlow:
    when:
      true: ${STEP == 'close'}
    commands:
      - tapOn: "Закрыть камеру|Close the camera"
      - extendedWaitUntil:
          visible: "Profile|Профиль"
          timeout: 10000
- runFlow:
    when:
      true: ${STEP == 'gallery'}
    commands:
      - tapOn: "Выбрать из галереи|Choose from gallery"
      # The picker sheet can open half-height with ${PHOTO} below its fold.
      - scrollUntilVisible:
          element:
            text: ${PHOTO}
          direction: DOWN
          timeout: 20000
      - tapOn: ${PHOTO}
      - extendedWaitUntil:
          visible: "Узнать вид|Identify species"
          timeout: 15000
      - takeScreenshot: gallery-aftershot
      - tapOn: "Узнать вид|Identify species"
      # The 3:4 photo (M11c) leaves only the candidates on the first screen; the attribution and the
      # actions are below the fold.
      - extendedWaitUntil:
          visible: "Monstera deliciosa"
          timeout: 40000
      - assertNotVisible: ".*\\d+ ?%.*"
      - assertNotVisible: ".*\\d+ (из|of) \\d+.*"
      - takeScreenshot: gallery-result-top
      - scrollUntilVisible:
          element:
            text: ".*Pl@ntNet.*"
          direction: DOWN
      - scrollUntilVisible:
          element:
            text: "Добавить к моим растениям|Add to my plants"
          direction: DOWN
      - scrollUntilVisible:
          element:
            text: "Снять ещё раз|Take another"
          direction: DOWN
      - assertVisible: "Просто узнать|Just find out"
      - takeScreenshot: gallery-result-bottom
- runFlow:
    when:
      true: ${STEP == 'retake'}
    commands:
      - scrollUntilVisible:
          element:
            text: "Снять ещё раз|Take another"
          direction: DOWN
      - tapOn: "Снять ещё раз|Take another"
      - extendedWaitUntil:
          visible: "Снять растение|Photograph the plant"
          timeout: 15000
      - takeScreenshot: retake-viewfinder
- runFlow:
    when:
      true: ${STEP == 'addmine'}
    commands:
      - scrollUntilVisible:
          element:
            text: "Добавить к моим растениям|Add to my plants"
          direction: DOWN
      - tapOn: "Добавить к моим растениям|Add to my plants"
      - extendedWaitUntil:
          visible: "Новое растение|Add New Plant"
          timeout: 10000
      # The short form (M11) shows the common name with «по виду»; the Latin name stays in «Ещё параметры».
      - assertVisible: ".*(Монстера|Monstera).*"
      - assertVisible: ".*(по виду|from species).*"
      - takeScreenshot: addmine-form
      - back
      - waitForAnimationToEnd

- runFlow:
    when:
      true: ${STEP == 'justlook'}
    commands:
      - scrollUntilVisible:
          element:
            text: "Просто узнать|Just find out"
          direction: DOWN
      - tapOn: "Просто узнать|Just find out"
      - extendedWaitUntil:
          visible: "Умная камера|Smart camera"
          timeout: 10000
      - assertVisible: "Profile|Профиль"
      - takeScreenshot: justlook-dashboard

- runFlow:
    when:
      true: ${STEP == 'disease'}
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible: "Умная камера|Smart camera"
          timeout: 30000
      - tapOn: "Умная камера|Smart camera"
      - runFlow:
          when:
            visible: "While using the app|При использовании приложения"
          commands:
            - tapOn: "While using the app|При использовании приложения"
      - extendedWaitUntil:
          visible: "Болезнь|Problem"
          timeout: 15000
      - tapOn: "Болезнь|Problem"
      - tapOn: "Выбрать из галереи|Choose from gallery"
      # The picker sheet can open half-height with ${PHOTO} below its fold.
      - scrollUntilVisible:
          element:
            text: ${PHOTO}
          direction: DOWN
          timeout: 20000
      - tapOn: ${PHOTO}
      - extendedWaitUntil:
          visible: "Проверить растение|Check the plant"
          timeout: 15000
      - tapOn: "Проверить растение|Check the plant"
      - extendedWaitUntil:
          visible: "Возможные причины|Possible causes"
          timeout: 80000
- runFlow:
    when:
      true: ${STEP == 'disease' || STEP == 'dcheck'}
    commands:
      # dcheck re-reads a result that an earlier stage left scrolled down.
      - scrollUntilVisible:
          element:
            text: "Возможные причины|Possible causes"
          direction: UP
      - assertVisible: "Возможные причины|Possible causes"
      - assertNotVisible: ".*\\d+ ?%.*"
      - assertNotVisible: ".*(осталось|left today).*"
      - assertNotVisible: ".*\\d+ (из|of) \\d+.*"
      - takeScreenshot: disease-result-top
      - scrollUntilVisible:
          element:
            text: "Это моё растение\\?|Is this my plant\\?"
          direction: DOWN
      - assertVisible: "Растение не из вашего списка, поэтому результат не сохранён.|This plant is not from your list, so the result is not saved."
      - scrollUntilVisible:
          element:
            text: "Готово|Done"
          direction: DOWN
      - assertVisible: "Готово|Done"
      - assertNotVisible: "Сохранить в журнал растения|Save to plant journal"
      - takeScreenshot: disease-result-bottom

- runFlow:
    when:
      true: ${STEP == 'mine'}
    commands:
      - scrollUntilVisible:
          element:
            text: "Это моё растение\\?|Is this my plant\\?"
          direction: DOWN
      - tapOn: "Это моё растение\\?|Is this my plant\\?"
      - extendedWaitUntil:
          visible: "Какое из ваших растений\\?|Which of your plants\\?"
          timeout: 10000
      - takeScreenshot: mine-picker
      - tapOn: ${PLANT}
      - extendedWaitUntil:
          visible: ".*${PLANT}.*"
          timeout: 10000
      - scrollUntilVisible:
          element:
            text: "Сохранить в журнал растения|Save to plant journal"
          direction: DOWN
      - takeScreenshot: mine-chosen
      - tapOn: "Сохранить в журнал растения|Save to plant journal"
      - extendedWaitUntil:
          visible: "Сохранено в журнал|Saved to journal"
          timeout: 30000
      - assertNotVisible: "Это моё растение\\?|Is this my plant\\?"
      - takeScreenshot: mine-saved
      - scrollUntilVisible:
          element:
            text: "Готово|Done"
          direction: DOWN
      - tapOn: "Готово|Done"
      - extendedWaitUntil:
          visible: "Умная камера|Smart camera"
          timeout: 10000

- runFlow:
    when:
      true: ${STEP == 'dcancel'}
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible: "Умная камера|Smart camera"
          timeout: 30000
      - tapOn: "Умная камера|Smart camera"
      - runFlow:
          when:
            visible: "While using the app|При использовании приложения"
          commands:
            - tapOn: "While using the app|При использовании приложения"
      - extendedWaitUntil:
          visible: "Болезнь|Problem"
          timeout: 15000
      - tapOn: "Болезнь|Problem"
      - tapOn: "Снять больное место|Photograph the sick spot"
      - extendedWaitUntil:
          visible: "Проверить растение|Check the plant"
          timeout: 15000
      - tapOn: "Проверить растение|Check the plant"
      - waitForAnimationToEnd
      - takeScreenshot: dcancel-error

- runFlow:
    when:
      true: ${STEP == 'denied'}
    commands:
      # launchApp grants every permission unless told otherwise.
      - launchApp:
          stopApp: true
          permissions:
            camera: deny
      - extendedWaitUntil:
          visible: "Умная камера|Smart camera"
          timeout: 30000
      - tapOn: "Умная камера|Smart camera"
      - runFlow:
          when:
            visible: "Don.t allow|Запретить|Не разрешать"
          commands:
            - tapOn: "Don.t allow|Запретить|Не разрешать"
      - extendedWaitUntil:
          visible: "Нет доступа к камере.*|No access to the camera.*"
          timeout: 15000
      - assertVisible: "Выбрать из галереи|Choose from gallery"
      - assertVisible: "Открыть настройки|Open settings"
      - assertNotVisible: "Снять растение|Photograph the plant"
      - takeScreenshot: denied
