# Diagnosis result variant B + journal save (feature m10-diagnosis-result; VAL-CARD-012..019).
# Keyless: the app is signed in (photos-signin.yaml) to a throwaway account. The caller seeds ${PLANT}
# with a real plant photo as its cover (the server stores it as an https URL). STEP selects one stage;
# between stages the caller reads GET /api/plants/:id/timeline with curl, counts api_usage rows and
# dumps the screen with uiautomator for the 48 dp check.
#   ru / en  Profile → language → Русский / English (from the plant list)
#   open     Russian UI: open ${PLANT} online and wait for the card
#   broken   no relaunch, airplane mode on (switched by the caller): photo sheet → «Проверить на болезни»
#            → the cover download fails → «Не удалось загрузить фото. Снимите новое.», no submit
#            (no diagnose request); Back returns to the card
#   result   ${PLANT}: photo sheet → «Проверить на болезни» (the cover is preset) → «Диагностировать»
#            (1 live call) → result: likelihood words, no %, «Что делать», disclaimer; the screen stays open
#   offline  no relaunch, airplane mode on (switched by the caller): «Сохранить в журнал растения» →
#            «Не удалось сохранить. Попробуйте ещё раз.» with the save button still enabled
#   retry    no relaunch, airplane mode off: the same button saves once → «Сохранено в журнал»;
#            «Готово» → plant detail, the journal shows the caption «Что с растением?: …»
#   reopen   force-stop and relaunch: the journal entry with its caption is still there
# Screenshots: <stage>-*.png.
appId: com.greenthumbplantcare.debug
name: GreenThumb diagnosis result (${STEP})
---
- runFlow:
    when:
      true: ${STEP == 'ru' || STEP == 'en'}
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible: "Profile|Профиль"
          timeout: 30000
      - tapOn: "Profile|Профиль"
      - scrollUntilVisible:
          element:
            text: "Language|Язык"
          direction: DOWN
      - tapOn: "Language|Язык"
      - extendedWaitUntil:
          visible: "Choose Language|Выберите язык"
          timeout: 10000
      - runFlow:
          when:
            true: ${STEP == 'ru'}
          commands:
            - tapOn: "Русский"
            - extendedWaitUntil:
                visible: "Язык"
                timeout: 10000
      - runFlow:
          when:
            true: ${STEP == 'en'}
          commands:
            - tapOn: "English"
            - extendedWaitUntil:
                visible: "Language"
                timeout: 10000

- runFlow:
    when:
      true: ${STEP == 'open' || STEP == 'result' || STEP == 'reopen'}
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible: "Профиль"
          timeout: 30000

- runFlow:
    when:
      true: ${STEP == 'open'}
    commands:
      - tapOn: ${PLANT}
      - extendedWaitUntil:
          visible: "Полить"
          timeout: 10000
      - takeScreenshot: open-card

- runFlow:
    when:
      true: ${STEP == 'broken'}
    commands:
      - tapOn: "Изменить фото растения"
      - extendedWaitUntil:
          visible: "Проверить на болезни"
          timeout: 5000
      - assertVisible: "по этому фото"
      - takeScreenshot: broken-photo-sheet
      - tapOn: "Проверить на болезни"
      # The cover download gives up after its 30 s request timeout.
      - extendedWaitUntil:
          visible: "Не удалось загрузить фото. Снимите новое."
          timeout: 45000
      - assertNotVisible: "Выбранное фото"
      - assertNotVisible: "Анализируем фото.*"
      - takeScreenshot: broken-photo-failed
      - back
      - extendedWaitUntil:
          visible: "Полить"
          timeout: 10000

- runFlow:
    when:
      true: ${STEP == 'result'}
    commands:
      - tapOn: ${PLANT}
      - extendedWaitUntil:
          visible: "Полить"
          timeout: 10000
      - scrollUntilVisible:
          element:
            text: "Что с растением\\?"
          direction: DOWN
      - takeScreenshot: result-card-entry
      - scrollUntilVisible:
          element:
            text: "Изменить фото растения"
          direction: UP
      - tapOn: "Изменить фото растения"
      - extendedWaitUntil:
          visible: "Проверить на болезни"
          timeout: 5000
      - tapOn: "Проверить на болезни"
      - extendedWaitUntil:
          visible: "Выбранное фото"
          timeout: 20000
      - takeScreenshot: result-input
      - tapOn: "Диагностировать"
      - extendedWaitUntil:
          visible: "Возможные причины"
          timeout: 90000
      - assertVisible: "Скорее всего|Возможно|Маловероятно"
      - assertNotVisible: ".*\\d+ ?%.*"
      - takeScreenshot: result-top
      - scrollUntilVisible:
          element:
            text: "Это подсказка, а не диагноз.*"
          direction: DOWN
      - assertVisible: "Что делать"
      - scrollUntilVisible:
          element:
            text: "Сохранить в журнал растения"
          direction: DOWN
      - takeScreenshot: result-bottom

- runFlow:
    when:
      true: ${STEP == 'offline'}
    commands:
      - tapOn: "Сохранить в журнал растения"
      - extendedWaitUntil:
          visible: "Не удалось сохранить. Попробуйте ещё раз."
          timeout: 30000
      - assertVisible:
          text: "Сохранить в журнал растения"
          enabled: true
      - takeScreenshot: offline-save-failed

- runFlow:
    when:
      true: ${STEP == 'retry'}
    commands:
      - tapOn: "Сохранить в журнал растения"
      - extendedWaitUntil:
          visible: "Сохранено в журнал"
          timeout: 30000
      - assertNotVisible: "Не удалось сохранить. Попробуйте ещё раз."
      - takeScreenshot: retry-saved
      - tapOn: "Готово"
      - extendedWaitUntil:
          visible: "Полить"
          timeout: 10000
      - scrollUntilVisible:
          element:
            text: "Что с растением\\?: .*"
          direction: DOWN
          timeout: 20000
      - takeScreenshot: retry-journal

- runFlow:
    when:
      true: ${STEP == 'reopen'}
    commands:
      - tapOn: ${PLANT}
      - extendedWaitUntil:
          visible: "Полить"
          timeout: 10000
      - scrollUntilVisible:
          element:
            text: "Что с растением\\?: .*"
          direction: DOWN
          timeout: 20000
      - takeScreenshot: reopen-journal
