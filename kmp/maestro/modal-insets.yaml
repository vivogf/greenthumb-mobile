# Full-screen modals clear of the system bars (feature m6-modal-insets-fix,
# VAL-APP-015). The caller creates a throwaway account with plant "InsetFern"
# (water every 7 days) and renders this flow with the key through
# `GT_FLOW=modal-insets.yaml GT_KEY_FILE=<file> render-smoke.sh run`.
# STEP selects one stage; between stages the caller dumps bounds with
# `uiautomator dump`, taps header actions with `adb shell input tap` at their
# centres and reads the plant with curl.
#   signin        clear state, sign in with the key, wait for the dashboard
#   care-open     relaunch (signed in), open plant detail and the care-settings modal
#   care-edit     in the open care modal: water frequency -> 5 (no Back,
#                 no hideKeyboard: inside GtModal that presses Back)
#   species-open  in the open care modal: open the species picker
# Selectors match both languages (the Samsung UI is Russian).
appId: com.greenthumbplantcare.debug
name: GreenThumb modal insets (${STEP})
---
- runFlow:
    when:
      true: ${STEP == 'signin'}
    commands:
      - launchApp:
          clearState: true
      # On elt_test the first launch after clearState sometimes leaves Maestro with an empty app hierarchy
      # (the screen shows «Key not found», Maestro sees only the status bar) until the app is launched again.
      - repeat:
          times: 4
          while:
            notVisible: "Skip|Пропустить|Key not found|Ключ не найден|I Have a Key|У меня есть ключ|Welcome Back|С возвращением"
          commands:
            - extendedWaitUntil:
                visible: "Skip|Пропустить|Key not found|Ключ не найден|I Have a Key|У меня есть ключ|Welcome Back|С возвращением"
                timeout: 15000
                optional: true
            - runFlow:
                when:
                  notVisible: "Skip|Пропустить|Key not found|Ключ не найден|I Have a Key|У меня есть ключ|Welcome Back|С возвращением"
                commands:
                  - launchApp
      - repeat:
          times: 15
          while:
            notVisible: "Welcome Back|С возвращением"
          commands:
            - runFlow:
                when:
                  visible: "Skip|Пропустить"
                commands:
                  - tapOn: "Skip|Пропустить"
            - runFlow:
                when:
                  visible: "Key not found|Ключ не найден"
                commands:
                  - tapOn: "Enter recovery key|Ввести ключ"
            - runFlow:
                when:
                  visible: "I Have a Key|У меня есть ключ"
                commands:
                  - tapOn: "I Have a Key|У меня есть ключ"
      - extendedWaitUntil:
          visible: "Welcome Back|С возвращением"
          timeout: 10000
      - tapOn: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
      - inputText: ${GT_RECOVERY_KEY}
      - hideKeyboard
      - tapOn: "Sign In|Войти"
      - extendedWaitUntil:
          visible: "Open plant card InsetFern|Открыть карточку растения InsetFern"
          timeout: 30000

- runFlow:
    when:
      true: ${STEP == 'care-open'}
    commands:
      - stopApp
      - launchApp
      - extendedWaitUntil:
          visible: "Open plant card InsetFern|Открыть карточку растения InsetFern"
          timeout: 30000
      - tapOn: "Open plant card InsetFern|Открыть карточку растения InsetFern"
      - scrollUntilVisible:
          element: "Care Settings|Настройки ухода"
          direction: DOWN
      - tapOn: "Care Settings|Настройки ухода"
      - extendedWaitUntil:
          visible: "Choose species|Выбрать вид"
          timeout: 5000
      - takeScreenshot: care-open

- runFlow:
    when:
      true: ${STEP == 'care-edit'}
    commands:
      - tapOn: "[0-9]{1,3}"
      - eraseText: 5
      - inputText: "5"
      - assertVisible: "5"
      - takeScreenshot: care-edited

- runFlow:
    when:
      true: ${STEP == 'species-open'}
    commands:
      - tapOn: "Choose species|Выбрать вид"
      - extendedWaitUntil:
          visible: "Name or scientific name|Название или латинское имя"
          timeout: 5000
      - takeScreenshot: species-open
