# Maestro flow: вход по recovery key throwaway-аккаунта и включение пушей в
# Профиле (FCM-подписка debug-пакета, architecture §8.3). Цель — POCO
# UWUKIZ6TNZZL8TBE (ru-RU, Play services) или эмулятор (en-US); селекторы —
# регулярки «ru|en» (матчер Maestro — полное совпадение).
#
# СЕКРЕТ. `${GT_RECOVERY_KEY}` — плейсхолдер. Прогон только через рендер:
#   GT_FLOW=push-enable.yaml GT_KEY_FILE=<key-file> GT_DEVICE=UWUKIZ6TNZZL8TBE \
#     bash kmp/maestro/render-smoke.sh run
# Скриншоты — только после ухода с экрана ввода ключа.
appId: com.greenthumbplantcare.debug
name: GreenThumb push enable (debug, ru/en)
---
- launchApp:
    clearState: true
# On elt_test the first launch after clearState sometimes leaves Maestro with an empty app hierarchy
# (the screen shows «Key not found», Maestro sees only the status bar) until the app is launched again.
- repeat:
    times: 4
    while:
      notVisible: "Skip|Пропустить|Key not found|Ключ не найден|I Have a Key|У меня есть ключ|Welcome Back|С возвращением"
    commands:
      - extendedWaitUntil:
          visible: "Skip|Пропустить|Key not found|Ключ не найден|I Have a Key|У меня есть ключ|Welcome Back|С возвращением"
          timeout: 15000
          optional: true
      - runFlow:
          when:
            notVisible: "Skip|Пропустить|Key not found|Ключ не найден|I Have a Key|У меня есть ключ|Welcome Back|С возвращением"
          commands:
            - launchApp
- repeat:
    times: 15
    while:
      notVisible: "Welcome Back|С возвращением"
    commands:
      - runFlow:
          when:
            visible: "Skip|Пропустить"
          commands:
            - tapOn: "Skip|Пропустить"
      - runFlow:
          when:
            visible: "Key not found|Ключ не найден"
          commands:
            - tapOn: "Enter recovery key|Ввести ключ"
      - runFlow:
          when:
            visible: "I Have a Key|У меня есть ключ"
          commands:
            - tapOn: "I Have a Key|У меня есть ключ"
- extendedWaitUntil:
    visible: "Welcome Back|С возвращением"
    timeout: 10000
- tapOn: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
- inputText: ${GT_RECOVERY_KEY}
- hideKeyboard
- tapOn: "Войти|Sign In"
- extendedWaitUntil:
    visible: "Мои растения|My Plants"
    timeout: 30000
- tapOn: "Профиль|Profile"
- extendedWaitUntil:
    visible: "Мой профиль|My Profile"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Напоминания о поливе|Watering Reminders"
    direction: DOWN
# The whole reminders row is one switch node: tapping its title toggles it.
- tapOn: "Напоминания о поливе|Watering Reminders"
# Системный диалог POST_NOTIFICATIONS (API 33+); на повторном прогоне его нет.
- runFlow:
    when:
      visible: "Разрешить|Allow"
    commands:
      - tapOn: "Разрешить|Allow"
- extendedWaitUntil:
    visible: "Уведомления включены|Notifications enabled"
    timeout: 30000
- takeScreenshot: push-enabled
