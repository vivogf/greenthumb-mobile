# Identify by photo in Add Plant (feature m3-identify-ui, VAL-IDENT-012..014,
# VAL-CROSS-014). Keyless, signed in, Russian UI. The newest gallery photo
# must be a plant (the caller pushes it with adb). STEP selects one stage:
#   live-ru     online: one live Pl@ntNet call, pick the catalog candidate,
#               save the plant
#   offline-ru  airplane mode (switched by the caller): error + catalog
#               search within 15 s, Back keeps a usable form
#   wild-ru     online: one live call with a non-catalog plant (oak) as the
#               newest photo; manual watering 5 stays, only species_name set
appId: com.greenthumbplantcare.debug
name: GreenThumb identify by photo (${STEP})
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Профиль"
    timeout: 30000
- tapOn: "Добавить новое растение|Добавить растение"
- assertVisible: "Выбрать вид"
- runFlow:
    when:
      true: ${STEP == 'wild-ru'}
    commands:
      - tapOn: "7"
      - inputText: "5"
      - hideKeyboard
- tapOn: "Определить по фото"
- tapOn: "Галерея"
- extendedWaitUntil:
    visible: "Photo taken on.*"
    timeout: 10000
- tapOn:
    text: "Photo taken on.*"
    index: 0

- runFlow:
    when:
      true: ${STEP == 'live-ru'}
    commands:
      - extendedWaitUntil:
          visible: "Уверенность: .*"
          timeout: 30000
      - assertVisible: "Определение вида"
      - assertVisible: "Powered by Pl@ntNet"
      - assertVisible: "Есть в каталоге"
      - assertNotVisible: ".*%.*"
      - takeScreenshot: live-candidates
      - tapOn: "Monstera deliciosa"
      - extendedWaitUntil:
          visible: "Монстера деликатесная"
          timeout: 3000
      - assertNotVisible: "Определение вида"
      - assertVisible: "Интервалы ухода заполнены по виду. Их можно изменить."
      - takeScreenshot: live-form-filled
      - scrollUntilVisible:
          element: "Добавить растение"
          direction: DOWN
      - tapOn: "Добавить растение"
      - extendedWaitUntil:
          visible: "Открыть карточку растения Монстера деликатесная"
          timeout: 15000
      - takeScreenshot: live-saved

- runFlow:
    when:
      true: ${STEP == 'offline-ru'}
    commands:
      - extendedWaitUntil:
          visible: "Распознавание недоступно"
          timeout: 15000
      - assertNotVisible: "Определяем вид…"
      - assertVisible: "Искать в каталоге"
      - assertVisible: "Powered by Pl@ntNet"
      - takeScreenshot: offline-unavailable
      - tapOn: "Искать в каталоге"
      - assertNotVisible: "Распознавание недоступно"
      - tapOn: "Название или латинское имя"
      - inputText: "монстера"
      - extendedWaitUntil:
          visible: "Monstera deliciosa"
          timeout: 3000
      - takeScreenshot: offline-catalog-search
      - back
      - back
      - extendedWaitUntil:
          visible: "Новое растение"
          timeout: 3000
      - assertVisible: "Определить по фото"
      - tapOn: "например, Монстера Деликатесная"
      - inputText: "Val Ident"
      - hideKeyboard
      - assertVisible: "Val Ident"
      - takeScreenshot: offline-form-usable
      - back
      - extendedWaitUntil:
          visible: "Профиль"
          timeout: 5000
      - takeScreenshot: offline-back-dashboard

- runFlow:
    when:
      true: ${STEP == 'wild-ru'}
    commands:
      - extendedWaitUntil:
          visible: "Уверенность: .*"
          timeout: 30000
      - assertVisible: "Powered by Pl@ntNet"
      - assertNotVisible: ".*%.*"
      - takeScreenshot: wild-candidates
      - tapOn: "Quercus robur"
      - assertNotVisible: "Определение вида"
      - assertNotVisible: "Интервалы ухода заполнены по виду. Их можно изменить."
      - assertVisible: "Quercus robur"
      - assertVisible: "5"
      - takeScreenshot: wild-form-filled
      - scrollUntilVisible:
          element: "Добавить растение"
          direction: DOWN
      - tapOn: "Добавить растение"
      - extendedWaitUntil:
          visible: "Профиль"
          timeout: 15000
      - takeScreenshot: wild-saved
