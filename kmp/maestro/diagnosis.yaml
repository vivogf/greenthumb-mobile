# Plant diagnosis by photo (feature m6-diagnosis-ui, VAL-DIAG-016/018/020/021/024,
# VAL-CROSS-010). Keyless, signed in, Russian UI on elt_test. The caller seeds a
# plant named ${PLANT} and keeps a plant photo in the gallery. Typed texts are
# ASCII: Maestro inputText cannot type Cyrillic on Android. STEP selects one stage:
#   history       water the plant and add the journal note "Spots on leaves"
#   live          detail → «Диагностика» → gallery photo + note → result card
#                 (1 live call) → «К растению» back to the same detail
#   reopen        open Diagnosis again: no photo, note or result from before
#   cancel        submit, cancel while loading; the input stays and no result
#                 appears within 45 s (the request may still reach the server)
#   offline       airplane mode on (switched by the caller): submit ends in the
#                 network error with «Повторить», not an endless spinner
#   retry         no relaunch (continues offline, airplane mode off): retry
#                 sends the same photo and note and shows a result (1 live call)
#   camera        take a photo with the emulator camera; the screen stays open
#                 so the caller can see the kept capture file
#   camera-submit no relaunch (continues camera): submit (1 live call)
#   back          no relaunch: system Back closes Diagnosis, detail is shown
appId: com.greenthumbplantcare.debug
name: GreenThumb diagnosis (${STEP})
---
- runFlow:
    when:
      true: ${STEP != 'retry' && STEP != 'camera-submit' && STEP != 'back'}
    commands:
      - stopApp
      - launchApp
      - extendedWaitUntil:
          visible: "Профиль"
          timeout: 30000
      - tapOn: ${PLANT}
      - extendedWaitUntil:
          visible: "Полить"
          timeout: 10000

- runFlow:
    when:
      true: ${STEP == 'history'}
    commands:
      - tapOn: "Полить"
      - scrollUntilVisible:
          element:
            text: "Добавить заметку…"
          direction: DOWN
      - tapOn: "Добавить заметку…"
      - inputText: "Spots on leaves"
      - tapOn: "Сохранить заметку"
      - hideKeyboard
      - scrollUntilVisible:
          element:
            text: "Spots on leaves"
          direction: DOWN
          timeout: 15000
      - takeScreenshot: history

- runFlow:
    when:
      true: ${STEP != 'history' && STEP != 'retry' && STEP != 'camera-submit' && STEP != 'back'}
    commands:
      - scrollUntilVisible:
          element:
            text: "Диагностика"
          direction: DOWN
      - tapOn: "Диагностика"
      - extendedWaitUntil:
          visible: "Сфотографируйте.*"
          timeout: 10000

- runFlow:
    when:
      true: ${STEP == 'reopen'}
    commands:
      - assertNotVisible: "Выбранное фото"
      - assertNotVisible: "Возможные причины"
      - assertVisible: "Что вас беспокоит\\? \\(необязательно\\)"
      - assertVisible: "Добавьте фото растения, чтобы начать."
      - takeScreenshot: reopen

- runFlow:
    when:
      true: ${STEP == 'live' || STEP == 'cancel' || STEP == 'offline'}
    commands:
      - tapOn: "Выбрать из галереи"
      - extendedWaitUntil:
          visible: "Photo taken on.*"
          timeout: 10000
      - tapOn:
          text: "Photo taken on.*"
          index: 0
      - extendedWaitUntil:
          visible: "Выбранное фото"
          timeout: 15000
      - tapOn: "Что вас беспокоит\\? \\(необязательно\\)"
      - inputText: "Yellow leaf edges"
      - hideKeyboard
      - tapOn: "Диагностировать"
      # Offline the error comes at once, so the loading state may never be seen.
      - runFlow:
          when:
            true: ${STEP != 'offline'}
          commands:
            - extendedWaitUntil:
                visible: "Анализируем фото.*"
                timeout: 5000
            - assertVisible: "Отменить диагностику"
            - takeScreenshot: ${STEP}-loading

- runFlow:
    when:
      true: ${STEP == 'live' || STEP == 'retry' || STEP == 'camera-submit'}
    commands:
      - runFlow:
          when:
            true: ${STEP == 'retry'}
          commands:
            - tapOn: "Повторить"
      - runFlow:
          when:
            true: ${STEP == 'camera-submit'}
          commands:
            - tapOn: "Диагностировать"
      - extendedWaitUntil:
          visible: "Возможные причины"
          timeout: 80000
      - assertVisible: "Вероятность: (низкая|средняя|высокая)"
      - assertVisible: "Что делать"
      - assertNotVisible: "Вероятность: .*\\d.*"
      - takeScreenshot: ${STEP}-result
      - scrollUntilVisible:
          element:
            text: "Это подсказка, а не диагноз.*"
          direction: DOWN
      - takeScreenshot: ${STEP}-result-bottom
      - runFlow:
          when:
            true: ${STEP == 'live'}
          commands:
            - scrollUntilVisible:
                element:
                  text: "К растению"
                direction: DOWN
            - tapOn: "К растению"
            - extendedWaitUntil:
                visible: "Полить"
                timeout: 10000
            - assertVisible: ${PLANT}
            - takeScreenshot: live-back-to-detail

- runFlow:
    when:
      true: ${STEP == 'cancel'}
    commands:
      - tapOn: "Отменить диагностику"
      - extendedWaitUntil:
          visible: "Диагностировать"
          timeout: 3000
      - assertVisible: "Выбранное фото"
      - assertVisible: "Yellow leaf edges"
      # Stays on the input for 45 s: the wait ends early only if the input is gone.
      - extendedWaitUntil:
          notVisible: "Диагностировать"
          timeout: 45000
          optional: true
      - assertVisible: "Диагностировать"
      - assertNotVisible: "Возможные причины"
      - takeScreenshot: cancel-after-45s

- runFlow:
    when:
      true: ${STEP == 'offline'}
    commands:
      - extendedWaitUntil:
          visible: "Нет связи с сервером.*"
          timeout: 80000
      - assertNotVisible: "Анализируем фото.*"
      - assertVisible: "Повторить"
      - assertVisible: "К растению"
      - takeScreenshot: offline-error

- runFlow:
    when:
      true: ${STEP == 'camera'}
    commands:
      - tapOn: "Сделать фото"
      - runFlow:
          when:
            visible: "While using the app|Only this time|При использовании приложения|Только в этот раз"
          commands:
            - tapOn: "While using the app|Only this time|При использовании приложения|Только в этот раз"
      - extendedWaitUntil:
          visible:
            id: ".*shutter.*"
          timeout: 20000
      - tapOn:
          id: ".*shutter.*"
      - extendedWaitUntil:
          visible:
            id: ".*done.*"
          timeout: 15000
      - tapOn:
          id: ".*done.*"
      - extendedWaitUntil:
          visible: "Выбранное фото"
          timeout: 15000
      - takeScreenshot: camera-preview

- runFlow:
    when:
      true: ${STEP == 'back'}
    commands:
      - back
      - extendedWaitUntil:
          visible: "Полить"
          timeout: 10000
      - assertVisible: ${PLANT}
      - takeScreenshot: back-detail
