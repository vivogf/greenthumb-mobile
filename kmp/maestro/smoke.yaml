# Maestro smoke — Stage 11b (VAL-TEST-006): различающий полив + две стартовые
# ветки установки. Развитие флоу Stage 11 п.4 (VAL-TEST-003, коммит 73e2fba).
#
# Пять сценариев договора (MANUAL-TEST-PHASE75) сохранены:
#   1. вход по recovery key;
#   2. добавление растения БЕЗ фото;
#   3. полив;
#   4. pull-to-refresh;
#   5. офлайн-перезапуск со списком.
#
# ЧТО ИЗМЕНИЛОСЬ ПРОТИВ Stage 11 п.4 (находки user-testing M11, W1/W2):
#   * Шаг 3 теперь ДИСКРИМИНИРУЮЩИЙ: растение создаётся с датой последнего
#     полива «сегодня − 10 дней» при частоте 3 → до нажатия «Water Plant»
#     флоу утверждает «7 days overdue», после — «3 days left». Утверждения
#     до и после разные; OR-паттерн «3 days left|4 days left|2 days left»,
#     совпадавший и до полива, убран. Мутационная проверка (утверждать
#     «3 days left» БЕЗ нажатия) валит флоу — см. handoff фичи.
#   * Флоу сам доходит до ввода ключа с ОБОИХ стартовых экранов (W1):
#     свежая установка открывает интро-карусель, установка поверх прежнего
#     пакета (firstInstallTime != lastUpdateTime, UpdateInstallMarker →
#     SessionManager) — экран «Key not found». Обе ветки завершаются экраном
#     входа по ключу и дальше идут общими шагами.
#
# СПОСОБ УСТАНОВКИ ПЕРЕД ПРОГОНОМ — обе ветки валидны:
#   * «свежая»: adb -s emulator-5554 uninstall com.greenthumbplantcare;
#     sleep 3; adb -s emulator-5554 install <debug.apk> (firstInstallTime ==
#     lastUpdateTime → интро);
#   * «поверх старого»: adb install -r <debug.apk> (firstInstallTime !=
#     lastUpdateTime → KeyNotFound).
#   Оба варианта прогнаны в handoff фичи kmp-maestro-smoke-hardening.
#
# СЕКРЕТ. `GT_RECOVERY_KEY` — плейсхолдер, в репозитории настоящего ключа нет.
# Перед прогоном воркер рендерит временную копию этого флоу в `/tmp/gt-m11/`
# (0600) скриптом, который читает ключ РЕДИРЕКТОМ из `/tmp/gt-utval/m8ut.key`
# и подставляет его на место плейсхолдера. Ключ не печатается, не идёт в env и
# не в argv. Временная копия и `--debug-output` удаляются после прогона
# (правила M11 в AGENTS.md «Расширение на M11»). Прогон с ключом — ТОЛЬКО
# `bash kmp/maestro/render-smoke.sh run`.
#
# Правила безопасности прогона (те же):
#   * `takeScreenshot` и дампы иерархии НЕ делаются, пока на экране поле с
#     ключом (шаги 1–1.4) — там только tapOn/inputText/assertVisible.
#   * Только эмулятор `-s emulator-5554`; физический телефон не трогаем.
#   * Аккаунт — только одобренный `kmp-val-m8ut-1255` (id 80). Новые аккаунты
#     не создаются: вход всегда по ключу, «Create New Account» не нажимается.
#   * Растение создаётся флоу и удаляется в том же флоу (последний блок),
#     чтобы `GET /api/plants` для id 80 остался `[]`.
#
# Язык флоу: селекторы на АНГЛИЙСКИХ строках. Эмулятор `elt_test` живёт в
# `en-US`, а дефолт Compose Resources — `values/` = en. На ru-локали
# эмулятора селекторы придётся заменить на русские строки.
appId: com.greenthumbplantcare
name: GreenThumb smoke (Stage 11b — VAL-TEST-006)
---
# 0. Чистый старт: без состояния прошлых прогонов и без handoff-файла.
- launchApp:
    clearState: true

# 0.1. Стартовый экран зависит от СПОСОБА УСТАНОВКИ (см. шапку), а сплеш
#     асинхронный (1–3 с), и `runFlow.when` оценивается МГНОВЕННО (проверено
#     пробником: оба `when` ушли в SKIPPED, пока шёл сплеш). Поэтому ветки
#     стартовых экранов завернуты в repeat-цикл с условием «не видим Welcome
#     Back» — единственный экран, на котором сходятся ОБЕ ветки. Гард `when`
#     в теле цикла делает тапы безопасными: повторная итерация видит только
#     ещё актуальный экран, тап по исчезнувшей кнопке не повторяется
#     («Enter recovery key»/«I Have a Key» идемпотентны и без этого).
#
#   * свежая установка: интро-карусель → Skip → экран выбора → «I Have a Key»;
#   * установка поверх старого пакета: «Key not found» → «Enter recovery key»
#     → режим логина СРАЗУ (мимо экрана выбора — App.kt ведёт в LoginMode.
#     Login, RN setMode login.tsx:82-90), поэтому гард «I Have a Key» на этой
#     ветке молчит.
- repeat:
    while:
      notVisible: "Welcome Back"
    commands:
      - runFlow:
          when:
            visible: "Your plants, organized"
          commands:
            - tapOn: Skip
      - runFlow:
          when:
            visible: "Key not found"
          commands:
            - tapOn: "Enter recovery key"
      - runFlow:
          when:
            visible: "I Have a Key"
          commands:
            - tapOn: "I Have a Key"
- assertVisible: Welcome Back

# 1. Ключ вводится ВСЛЕПУЮ — обязательное правило прогона (см. «СЕКРЕТ»).
#     На этом шаге запрещены: `takeScreenshot`, дампы иерархии, `maestro
#     hierarchy`, а также ЛЮБОЙ вывод stdout, в который Maestro дописывает
#     введённый текст (`Input text <значение>` — так устроен раннер Maestro
#     2.10.0). Поэтому `render-smoke.sh` пропускает stdout через фильтр,
#     заменяющий значение на `<GT_RECOVERY_KEY>`, а `--debug-output` после
#     прогона удаляется целиком. `inputText: ${GT_RECOVERY_KEY}` ниже —
#     плейсхолдер в репозитории; в прогоне его подставляет рендер-скрипт.
- tapOn: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
- inputText: ${GT_RECOVERY_KEY}
# Клавиатура перекрывает кнопку — прячем её ДО тапа.
- hideKeyboard
- tapOn: Sign In
- extendedWaitUntil:
    visible: "My Plants"
    timeout: 30000

# ───────────── 2. Добавление растения без фото, дата в прошлом ─────────────
# Пустой аккаунт: пустой сад с кнопкой «Add Plant». Частота 3 дня; дата
# последнего полива — «сегодня − 10» (шаг 3 получит просрочку 7 дней).
# Селекторы полей — по их плейсхолдерам: подписи («Plant Name» и т.д.) в
# этой форме не кликабельны, поля помечены плейсхолдером.
- tapOn: Add Plant
- assertVisible: Add New Plant
# Фото НЕ трогаем — контракт требует добавление без фото.
- tapOn: "e.g., Monstera Deliciosa"
- inputText: M11 Maestro Fern
- tapOn: "e.g., Living Room"
- inputText: Bench A
# Частота полива. Поле идёт после подписи «Watering Frequency (days)», но его
# плейсхолдер — «7», и он ЕДИНСТВЕННЫЙ на экране (у полей имени/локации
# плейсхолдеры другие). Клавиатуру прячем ДО тапа: пока она открыта, форма
# сдвинута, и тап уезжает в поле локации.
- hideKeyboard
- tapOn: "7"
- inputText: "3"
- hideKeyboard
# Дата последнего полива — В ПРОШЛОМ (дискриминатор шага 3). Поле пикера
# открывается тапом по ЕГО ВИДИМОМУ ТЕКСТУ («09/30/2026» — MM/DD/YYYY
# сегодняшней даты; contentDescription «Date field …» матчером Maestro НЕ
# берётся — проверено дампом и пробой). ВАЖНО: текстовый матчер Maestro —
# ПОЛНОЕ совпадение (regex anchors), не подстрока: селектор обязан равняться
# всему тексту узла. Поэтому ячейка дня тапается ПОЛНЫМ FULL-стилем
# material3 («Sunday, September 20, 2026» — с днём недели; у не-сегодняшних
# ячеек префикса «Today,» нет). Даты нельзя фиксировать в файле: сетка
# пикера открывается на ТЕКУЩИЙ месяц, и зафиксированное «20 число» уедет
# из видимой сетки в следующем месяце. Обе даты вычисляются evalScript'ом
# ОТ СЕГОДНЯШНЕГО ДНЯ (часы хоста и эмулятора в одной таймзоне —
# Europe/Moscow; проверено в handoff фичи). evalScript печатает выражение в
# stdout — секретов в нём нет; второй вызов переиспользует `output`.
- evalScript: "${output = (() => { var d = new Date(); return d.toLocaleDateString('en-US', {month: '2-digit', day: '2-digit', year: 'numeric'}); })()}"
- tapOn: ${output}
- evalScript: "${output = (() => { var d = new Date(); d.setDate(d.getDate() - 10); return d.toLocaleDateString('en-US', {weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'}); })()}"
- tapOn: ${output}
- tapOn: Done
- scrollUntilVisible:
    element:
      text: "Add Plant"
    direction: DOWN
- tapOn: "Add Plant"
- extendedWaitUntil:
    visible: "Open plant card M11 Maestro Fern"
    timeout: 30000

# ───────────────── 3. Полив — ДИСКРИМИНИРУЮЩИЙ шаг ─────────────────────────
# Частота 3, последний полив 10 дней назад → следующий полив просрочен на
# 7 дней. ДО нажатия утверждаем просрочку (пилюля карточки дашборда и бейдж
# деталей), ПОСЛЕ нажатия — «3 days left» (дата становится сегодняшней).
# Утверждения до и после не пересекаются; текст «3 days left» до нажатия на
# экране появиться не может.
- assertVisible: "7 days overdue"
- tapOn: "Open plant card M11 Maestro Fern"
- extendedWaitUntil:
    visible: "7 days overdue"
    timeout: 20000
- tapOn: "Water Plant"
- extendedWaitUntil:
    visible: "3 days left"
    timeout: 30000
# Страховка различимости: просрочка после полива исчезла со всего экрана.
# Матчер — полное совпадение текста узла, поэтому шаблон «.*overdue»
# (любой текст, кончающийся на «overdue»: «7 days overdue», «1 day overdue»).
- assertNotVisible: ".*overdue"
- tapOn: Back

# ─────────────────────────── 4. Pull-to-refresh ───────────────────────────
# Тяга верхнего края списка вниз — ручной refresh; ошибка не прячет данные.
- swipe:
    start: "50%, 35%"
    end: "50%, 80%"
    duration: 600
- extendedWaitUntil:
    visible: "Open plant card M11 Maestro Fern"
    timeout: 20000

# ─────────────── 5. Офлайн-перезапуск со списком (данные из кэша) ───────────────
# 5.1. Авиарежим: приложение живо, сеть исчезает.
- setAirplaneMode:
    value: enabled
# 5.2. Полный перезапуск процесса ПРИ выключенной сети: сессия читается из
#     SecureStore + cached_user, Room отдаёт список — экран входа не показывается.
- killApp
- launchApp
- extendedWaitUntil:
    visible: "Open plant card M11 Maestro Fern"
    timeout: 40000
# 5.3. Сеть обратно.
- setAirplaneMode:
    value: disabled

# ───────────────────── Уборка: удалить растение этого флоу ─────────────────────
# Растение создано шагом 2 → удаляем, чтобы GET /api/plants был [].
- tapOn: "Open plant card M11 Maestro Fern"
- scrollUntilVisible:
    element:
      text: "Delete plant"
    direction: DOWN
- tapOn: "Delete plant"
- assertVisible: Delete this plant?
- tapOn: Delete
- extendedWaitUntil:
    notVisible: "Open plant card M11 Maestro Fern"
    timeout: 20000
- assertVisible: No plants yet
