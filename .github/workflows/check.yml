name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run check

  kmp:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # setup-java экспортирует JAVA_HOME — его подхватит kmp/scripts/check.sh
      # (скрипт задаёт JAVA_HOME сам только если окружение его не дало).
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
          cache-dependency-path: 'kmp/gradle/wrapper/gradle-wrapper.properties'
      # Шаги повторяют локальный гейт (та же команда в mission-check.sh / services.yaml).
      # Android SDK предустановлен на macos-раннерах GitHub с принятыми лицензиями.
      - run: bash kmp/scripts/check.sh
